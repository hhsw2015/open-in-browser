<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open In Browser Apps - Settings</title>
    <style>
      :root {
        --bg: #f6f8fa;
        --panel: #ffffff;
        --border: #d0d7de;
        --text: #24292f;
        --sub: #57606a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 860px;
        margin: 24px auto;
        padding: 0 16px;
      }

      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }

      p.desc {
        margin: 0 0 16px;
        color: var(--sub);
        font-size: 13px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 12px;
      }

      .panel h2 {
        margin: 0 0 10px;
        font-size: 14px;
      }

      .hint {
        margin: 0 0 10px;
        color: var(--sub);
        font-size: 12px;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 10px;
      }

      .field:last-child {
        margin-bottom: 0;
      }

      label {
        font-size: 12px;
        color: var(--sub);
      }

      input[type="text"],
      input[type="url"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
      }

      input[type="checkbox"] {
        width: 16px;
        height: 16px;
      }

      #targets {
        display: grid;
        gap: 10px;
      }

      .target-row {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        background: #fbfcfd;
      }

      .target-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto;
        gap: 8px;
        align-items: end;
      }

      .target-grid .cell {
        display: grid;
        gap: 6px;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }

      button {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #ffffff;
        cursor: pointer;
        font-size: 13px;
      }

      button.primary {
        background: #0969da;
        border-color: #0969da;
        color: #ffffff;
      }

      #status {
        margin-top: 10px;
        font-size: 13px;
        color: var(--sub);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Extension Settings</h1>
      <p class="desc">Configure API base URL, custom targets, shortcuts, and clipboard behavior.</p>

      <form id="settings-form">
        <section class="panel">
          <h2>API</h2>
          <div class="field">
            <label for="apiBase">Base URL</label>
            <input id="apiBase" name="apiBase" type="url" placeholder="http://localhost:5000">
          </div>
        </section>

        <section class="panel">
          <h2>Targets</h2>
          <p class="hint">Shortcut format: <code>ctrl+shift+o</code>, <code>alt+shift+o</code>, <code>meta+shift+o</code>. You can add any number of targets.</p>
          <div id="targets"></div>
          <div class="actions">
            <button id="add-target" type="button">Add Target</button>
          </div>
        </section>

        <section class="panel">
          <h2>Clipboard</h2>
          <div class="field">
            <label for="clearClipboardAfterUse">Clear clipboard after using clipboard URL</label>
            <input id="clearClipboardAfterUse" name="clearClipboardAfterUse" type="checkbox" checked>
          </div>
        </section>

        <div class="actions">
          <button class="primary" type="submit">Save</button>
          <button id="reset-defaults" type="button">Reset Defaults</button>
        </div>
      </form>
      <div id="status"></div>
    </main>

    <template id="target-row-template">
      <div class="target-row">
        <input class="target-id" type="hidden">
        <div class="target-grid">
          <div class="cell">
            <label>Name</label>
            <input class="target-name" type="text" placeholder="ChatGPT Atlas">
          </div>
          <div class="cell">
            <label>Endpoint</label>
            <input class="target-endpoint" type="text" placeholder="/talkWithChatgptAltas">
          </div>
          <div class="cell">
            <label>Shortcut</label>
            <input class="target-shortcut" type="text" placeholder="ctrl+shift+o">
          </div>
          <button class="remove-target" type="button">Remove</button>
        </div>
      </div>
    </template>

    <script src="options.js"></script>
  </body>
</html>
